name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths: [ 'flight-log-reader/android/**', '.github/workflows/build-apk.yml' ]
  pull_request:
    paths: [ 'flight-log-reader/android/**', '.github/workflows/build-apk.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flight-log-reader/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: flight-log-reader-debug
          path: flight-log-reader/android/app/build/outputs/apk/debug/*.apk

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: flight-log-reader/android/app/build/outputs/apk/debug/*.apk
